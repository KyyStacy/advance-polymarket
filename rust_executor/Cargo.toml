[package]
name = "polymarket_hft"
version = "0.1.0"
edition = "2021"

[lib]
name = "polymarket_hft"
crate-type = ["cdylib"]

[dependencies]
# PyO3: Python <-> Rust FFI
# abi3-py39: build once, run on Python 3.9+
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }

# Tokio: async runtime (multi-thread for HTTP pool)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

# reqwest: high-level HTTP client built on hyper + rustls
# rustls-tls: pure-Rust TLS (no OpenSSL dependency)
# http2: HTTP/2 multiplexing + connection reuse
# gzip: response decompression
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "http2",
    "charset",
    "gzip",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HMAC-SHA256 for Polymarket L2 auth headers
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# Shared Tokio runtime — initialized once
once_cell = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
