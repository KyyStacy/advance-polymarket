[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "polymarket-hft"
version = "0.1.0"
description = "Rust HFT hot path for Polymarket CLOB — HTTP/2 pool + HMAC auth"
requires-python = ">=3.9"

[tool.maturin]
# Rust crate lives in rust_executor/ subdirectory
manifest-path = "rust_executor/Cargo.toml"
module-name = "polymarket_hft"
# ABI3 wheel: build once, compatible with Python 3.9+
features = ["pyo3/extension-module", "pyo3/abi3-py39"]
